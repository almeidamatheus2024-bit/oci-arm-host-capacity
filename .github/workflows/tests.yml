name: Oracle VM Auto Create

on:
  push:
    branches:
      - main

  schedule:
    - cron: '*/5 * * * *'

  workflow_dispatch:

concurrency:
  group: oracle-vm-auto-create
  cancel-in-progress: false

jobs:
  create-vm:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Validate composer.json
        run: composer validate

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Create OCI private key
        shell: bash
        env:
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
        run: |
          printf '%s' "$OCI_PRIVATE_KEY" > /tmp/oci_private_key.pem
          chmod 600 /tmp/oci_private_key.pem

      - name: Run Oracle VM creation attempts
        shell: bash
        env:
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_USER_ID: ${{ secrets.OCI_USER_ID }}
          OCI_TENANCY_ID: ${{ secrets.OCI_TENANCY_ID }}
          OCI_KEY_FINGERPRINT: ${{ secrets.OCI_KEY_FINGERPRINT }}
          OCI_PRIVATE_KEY_FILENAME: /tmp/oci_private_key.pem
          OCI_AVAILABILITY_DOMAIN: ${{ secrets.OCI_AVAILABILITY_DOMAIN }}
          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          OCI_IMAGE_ID: ${{ secrets.OCI_IMAGE_ID }}
          OCI_OCPUS: ${{ secrets.OCI_OCPUS }}
          OCI_MEMORY_IN_GBS: ${{ secrets.OCI_MEMORY_IN_GBS }}
          OCI_SHAPE: ${{ secrets.OCI_SHAPE }}
          OCI_MAX_INSTANCES: ${{ secrets.OCI_MAX_INSTANCES }}
          OCI_SSH_PUBLIC_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
          TELEGRAM_USER_ID: ${{ secrets.TELEGRAM_USER_ID }}
          TELEGRAM_BOT_API_KEY: ${{ secrets.TELEGRAM_BOT_API_KEY }}

        run: |
          echo "=================================================="
          echo "ORACLE VM AUTO CREATE"
          echo "Workflow iniciado em: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "=================================================="

          echo ""
          echo ">>> TENTATIVA 1"
          echo "Horário: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          php index.php

          echo ""
          echo ">>> Aguardando 3 minutos para nova tentativa..."
          sleep 180

          echo ""
          echo ">>> TENTATIVA 2"
          echo "Horário: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          php index.php

          echo ""
          echo "=================================================="
          echo "Ciclo concluído em: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "Próximo ciclo será iniciado pelo GitHub Actions."
          echo "=================================================="
